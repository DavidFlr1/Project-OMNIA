name: Deploy Minecraft Server

on:
  push:
    branches: [main]
    paths: 
      - 'minecraft-server/**'
      - '.env.example'
      - 'docker-compose.yml'
      - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd omnia
            
            # Stop containers first
            cd minecraft-server
            sudo docker compose -f docker-compose.prod.yml down || true
            cd ..
            
            # Force clean for permission issues
            sudo git reset --hard HEAD
            sudo git clean -fd
            
            # Configure sparse-checkout (fix pattern)
            git config core.sparseCheckout true
            echo "minecraft-server/" > .git/info/sparse-checkout
            echo ".env.example" >> .git/info/sparse-checkout
            echo "docker-compose.yml" >> .git/info/sparse-checkout
            echo "README.md" >> .git/info/sparse-checkout
            
            # Pull latest changes
            git pull origin main
            
            # Deploy
            cd minecraft-server
            sudo chmod +x deploy.sh
            sudo ./deploy.sh